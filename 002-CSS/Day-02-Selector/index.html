<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Day 2 - Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Selectors</h1>

    <h2 class="heading">Class Selector Example</h2>

    <h2 id="main-heading">ID Selector Example</h2>

    <p>
        This is the first paragraph.
    </p>

    <p class="text">
        This paragraph uses a class.
    </p>

    <div class="container">

        <h3>Inside Container</h3>

        <p>
            This paragraph is inside the container.
        </p>

    </div>

    <div>

        <p>
            Another paragraph outside the container.
        </p>

    </div>

</body>
</html>
